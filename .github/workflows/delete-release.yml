# Run from the Actions tab: deletes a release and its tag.
name: Delete release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to delete (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ inputs.tag }}" --cleanup-tag --yes --repo "${{ github.repository }}"
